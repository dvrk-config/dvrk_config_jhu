scene:
  include: ../simulator_cart.yaml
  camera:
    mode: stereo
    owner: ECM
    width: 800
    height: 600
    horizontal_fov_deg: 60.0
    near_clip_m: 0.005
    far_clip_m: 10.0
    encoding: rgba8
    baseline_m: 0.006
    publish_rate_hz: 15.0
    light:
      enabled: false
    transports:
    - unixfd
    unixfd:
      socket_path: '@dvrk:simulator:stereo_source'
