scene:
  include: ../simulator_cart.yaml
  camera:
    mode: stereo
    owner: ECM
    renderer: warp_raytrace
    width: 1900
    height: 1024
    horizontal_fov_deg: 60.0
    near_clip_m: 0.005
    far_clip_m: 10.0
    baseline_m: 0.006
    publish_rate_hz: 15.0
    transports:
    - unixfd
    unixfd:
      socket_path: '@dvrk:simulator:stereo_source'
