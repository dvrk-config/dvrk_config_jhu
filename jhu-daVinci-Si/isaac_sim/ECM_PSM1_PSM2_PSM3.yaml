scene:
  include: ../simulator_cart.yaml
  camera:
    mode: stereo
    owner: ECM
    width: 1900
    height: 1024
    horizontal_fov_deg: 60.0
    near_clip_m: 0.005
    far_clip_m: 10.0
    baseline_m: 0.006
    publish_rate_hz: 30.0
    transports:
    - rtsp
    rtsp:
      port: 8554
      mount_path: /ECM
      encoding: h264
